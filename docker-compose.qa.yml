# Synthetic staging only. Use a separate project: docker compose -p charity-qa -f docker-compose.qa.yml up --build
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: charity_staging_test
      POSTGRES_USER: qa
      POSTGRES_PASSWORD: synthetic_qa_only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qa -d charity_staging_test"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes: [qa_data:/var/lib/postgresql/data]
  seed:
    build: .
    # Loopback guard stays strict; share only this QA database's network namespace.
    network_mode: service:postgres
    environment:
      TEST_DATABASE_URL: postgresql://qa:synthetic_qa_only@127.0.0.1:5432/charity_staging_test
      QA_FIXTURE_PATH: /tmp/qa-fixtures.json
    command: ["npm", "run", "seed:test"]
    depends_on:
      postgres: {condition: service_healthy}
    restart: "no"
  app:
    build: .
    environment:
      NODE_ENV: test
      DATABASE_URL: postgresql://qa:synthetic_qa_only@postgres:5432/charity_staging_test
      COOKIE_SECURE: "false"
      CORS_ORIGIN: http://127.0.0.1:4180
      PORT: "3000"
      BOOTSTRAP_SECRET: synthetic_qa_bootstrap_only
    ports: ["127.0.0.1:4180:3000"]
    depends_on:
      seed: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  qa_data:
