services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: family_case
      POSTGRES_USER: family_app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U family_app -d family_case"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [backend]
  migrate:
    build: .
    environment: &app_env
      NODE_ENV: production
      DATABASE_URL: postgres://family_app:${POSTGRES_PASSWORD}@postgres:5432/family_case
      DATABASE_SSL: "false"
      PORT: "3000"
      CORS_ORIGIN: ${APP_BASE_URL:?set APP_BASE_URL}
      COOKIE_SECURE: "true"
      TRUST_PROXY: "true"
      BOOTSTRAP_SECRET: ${BOOTSTRAP_SECRET:?set BOOTSTRAP_SECRET}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-8}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      REQUEST_TIMEOUT_MS: ${REQUEST_TIMEOUT_MS:-30000}
    command: ["npm","run","migrate"]
    depends_on:
      postgres: {condition: service_healthy}
    networks: [backend]
    restart: "no"
  app:
    build: .
    restart: unless-stopped
    environment: *app_env
    depends_on:
      postgres: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
    networks: [backend]
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/certs:/etc/nginx/certs:ro
    depends_on:
      app: {condition: service_healthy}
    networks: [backend]
volumes:
  postgres_data:
networks:
  backend:
    driver: bridge
