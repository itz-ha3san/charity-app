services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: family_case
      POSTGRES_USER: family_app
      POSTGRES_PASSWORD: change_me
    ports: ["55432:5432"]
    volumes: ["family_pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U family_app -d family_case"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  family_pgdata:
